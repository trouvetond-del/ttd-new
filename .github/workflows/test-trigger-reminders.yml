name: Test manuel send-mover-quote-reminders

on:
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler la fonction et publier la reponse
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq
          R1=$(curl -s -X POST "https://bvvbkaluajgdurxnnqqu.supabase.co/functions/v1/send-mover-quote-reminders" -H "Content-Type: application/json")
          R2=$(curl -s -X POST "https://bvvbkaluajgdurxnnqqu.supabase.co/functions/v1/send-profile-reminder" -H "Content-Type: application/json")
          BODY=$(jq -n --arg a "$R1" --arg b "$R2" '{title: "Test manuel reminders - resultat", body: ("send-mover-quote-reminders:\n```\n" + $a + "\n```\n\nsend-profile-reminder:\n```\n" + $b + "\n```")}')
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/issues" -d "$BODY"
