name: Agent SEO (pages ville, articles de blog, rapport hebdo)

on:
  schedule:
    - cron: "0 6 * * 1"   # lundi : article client + rapport
    - cron: "0 6 * * 4"   # jeudi : article déménageur
  workflow_dispatch:
    inputs:
      audience:
        description: "client ou mover (vide = selon le jour)"
        required: false
        default: ""
      skip_article:
        description: "true = rapport seulement"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: seo-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Préparer la base (idempotent) + 50 pages ville
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client
          psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 -f supabase/migrations_manuelles/seo-reports.sql
          psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 -f supabase/migrations_manuelles/city-pages-seed-2.sql
      - name: Installer
        working-directory: scripts/seo-agent
        run: npm install --no-audit --no-fund --no-save @supabase/supabase-js@2
      - name: Écrire et publier l'article de blog
        if: github.event.inputs.skip_article != 'true'
        working-directory: scripts/seo-agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: https://bvvbkaluajgdurxnnqqu.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE_AUDIENCE: ${{ github.event.inputs.audience }}
        run: node blog.mjs
      - name: Reconstruire le site (pages HTML lisibles par Google + plan du site)
        run: |
          mkdir -p marketing/seo
          date -u +"%Y-%m-%dT%H:%M:%SZ" > marketing/seo/last-run.txt
          git config user.name "agent-seo"
          git config user.email "agent-seo@users.noreply.github.com"
          git add marketing/seo/last-run.txt
          git commit -m "Agent SEO : nouvelles pages publiées" || exit 0
          git push
      - name: Attendre la mise en ligne
        run: sleep 240
      - name: Rapport SEO hebdomadaire
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * 1'
        working-directory: scripts/seo-agent
        env:
          SUPABASE_URL: https://bvvbkaluajgdurxnnqqu.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node report.mjs
