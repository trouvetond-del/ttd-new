name: Deploy acquisition funnel (relance 3 emails)
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['supabase/sql/acquisition-funnel.sql', 'supabase/functions/send-partial-lead-reminder/**', '.github/workflows/deploy-acquisition-funnel.yml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun test scripts/partial-lead-sequence.test.ts scripts/volume-calculator.test.ts scripts/ad-cost.test.ts
      - env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          q() { python3 -c 'import json,sys;print(json.dumps({"query":sys.stdin.read()}))' | curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/bvvbkaluajgdurxnnqqu/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @-; echo; }
          q < supabase/sql/acquisition-funnel.sql
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy send-partial-lead-reminder --project-ref bvvbkaluajgdurxnnqqu --no-verify-jwt
