name: Stats (lecture seule, temporaire)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Requête stats agrégées (aucune PII)
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client jq
          set +e
          OUT=$(psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 -P pager=off <<'SQL' 2>&1

          \echo '=== Application REELLE du correctif setval (idempotent, sans transaction) ==='
          \i supabase/migrations_manuelles/quote-reference-and-reminders.sql

          \echo '=== Etat de la sequence apres correctif ==='
          SELECT last_value FROM quote_requests_reference_seq;
          SELECT COALESCE(MAX(substring(reference from 5)::bigint), 0) AS max_reference_utilisee
          FROM quote_requests WHERE reference ~ '^DEM-[0-9]+$';

          \echo '=== RE-REPRODUCTION du scenario signale (3 INSERT, comme le frontend actuel), transaction annulee ==='
          BEGIN;
          DO $$
          DECLARE
            new_id uuid;
            i int;
          BEGIN
            FOR i IN 1..3 LOOP
              INSERT INTO quote_requests (
                client_user_id, client_name, client_email, client_phone,
                from_address, from_city, from_postal_code,
                to_address, to_city, to_postal_code,
                from_home_size, from_home_type, to_home_size, to_home_type, volume_m3,
                moving_date, status
              ) VALUES (
                gen_random_uuid(), 'Test Repro2 ' || i, 'testrepro2' || i || '@example.com', '060000000' || i,
                '1 rue Test', 'Paris', '75001',
                '2 rue Test', 'Lyon', '69000',
                'T2', 'Appartement', 'T2', 'Appartement', 20,
                CURRENT_DATE + 30, 'new'
              ) RETURNING id INTO new_id;
              RAISE NOTICE 'INSERT % OK, id=%', i, new_id;
            END LOOP;
            RAISE NOTICE 'SUCCES: les 3 INSERT ont reussi sans collision apres correctif';
          END $$;
          ROLLBACK;
          SQL
          )
          echo "$OUT"
          BODY=$(jq -n --arg t "Stats agrégées $(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg b "$OUT" '{title:$t, body:("```\n" + $b + "\n```")}')
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/issues" -d "$BODY"
