name: Stats (lecture seule, temporaire)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Requête stats agrégées (aucune PII)
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client jq
          OUT=$(psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 <<'SQL' 2>&1
          -- Uniquement des agrégats (moyennes, comptages, pourcentages) --
          -- jamais de nom, email ou adresse individuelle dans ces requêtes.

          \echo '=== 0) Fenetre temporelle : premiere et derniere quote_request, total tout confondu ==='
          SELECT count(*) AS total_quote_requests_tout_statut,
                 min(created_at) AS premiere_demande,
                 max(created_at) AS derniere_demande
          FROM quote_requests;

          \echo '=== 0bis) Repartition par source (lead_source) ==='
          SELECT COALESCE(lead_source, '(null, formulaire complet direct)') AS source, count(*) AS total
          FROM quote_requests
          GROUP BY 1
          ORDER BY 2 DESC;

          \echo '=== 0ter) Combien de demandes ont un compte client lie (client_user_id non null) vs simple lead ==='
          SELECT
            count(*) FILTER (WHERE client_user_id IS NOT NULL) AS avec_compte,
            count(*) FILTER (WHERE client_user_id IS NULL) AS sans_compte_lead_seul
          FROM quote_requests;

          \echo '=== 1) Demandes COMPLETES (meme critere que partout dans l app) : total, tout-temps et 90 derniers jours ==='
          SELECT
            count(*) FILTER (WHERE true) AS total_completes_tout_temps,
            count(*) FILTER (WHERE created_at >= now() - interval '90 days') AS completes_90j
          FROM quote_requests
          WHERE from_home_size IS NOT NULL AND from_home_size <> ''
            AND from_home_type IS NOT NULL AND from_home_type <> ''
            AND to_home_size IS NOT NULL AND to_home_size <> ''
            AND to_home_type IS NOT NULL AND to_home_type <> ''
            AND volume_m3 IS NOT NULL AND volume_m3 > 0;

          \echo '=== 1bis) Repartition des demandes INCOMPLETES : quel champ manque le plus souvent ==='
          SELECT
            count(*) AS total_incompletes,
            count(*) FILTER (WHERE from_city IS NULL OR from_city = '') AS sans_ville_depart,
            count(*) FILTER (WHERE to_city IS NULL OR to_city = '') AS sans_ville_arrivee,
            count(*) FILTER (WHERE from_home_size IS NULL OR from_home_size = '') AS sans_taille_depart,
            count(*) FILTER (WHERE volume_m3 IS NULL OR volume_m3 <= 0) AS sans_cubage,
            count(*) FILTER (WHERE client_user_id IS NULL) AS sans_compte_client
          FROM quote_requests
          WHERE NOT (
            from_home_size IS NOT NULL AND from_home_size <> ''
            AND from_home_type IS NOT NULL AND from_home_type <> ''
            AND to_home_size IS NOT NULL AND to_home_size <> ''
            AND to_home_type IS NOT NULL AND to_home_type <> ''
            AND volume_m3 IS NOT NULL AND volume_m3 > 0
          );

          \echo '=== 2) % de demandes completes ayant recu au moins 1 devis (90 derniers jours) ==='
          WITH base AS (
            SELECT qr.id,
                   (SELECT count(*) FROM quotes q WHERE q.quote_request_id = qr.id) AS nb_devis
            FROM quote_requests qr
            WHERE qr.created_at >= now() - interval '90 days'
              AND qr.from_home_size IS NOT NULL AND qr.from_home_size <> ''
              AND qr.from_home_type IS NOT NULL AND qr.from_home_type <> ''
              AND qr.to_home_size IS NOT NULL AND qr.to_home_size <> ''
              AND qr.to_home_type IS NOT NULL AND qr.to_home_type <> ''
              AND qr.volume_m3 IS NOT NULL AND qr.volume_m3 > 0
          )
          SELECT
            count(*) AS demandes_completes_90j,
            count(*) FILTER (WHERE nb_devis >= 1) AS avec_au_moins_1_devis,
            round(100.0 * count(*) FILTER (WHERE nb_devis >= 1) / NULLIF(count(*), 0), 1) AS pct_avec_devis,
            round(avg(nb_devis) FILTER (WHERE nb_devis >= 1), 1) AS moyenne_devis_quand_au_moins_1
          FROM base;

          \echo '=== 3) Delai moyen/median jusquau premier devis (heures), demandes completes des 90 derniers jours ayant recu >=1 devis ==='
          WITH first_quote AS (
            SELECT qr.id, qr.created_at AS demande_creee,
                   (SELECT min(q.created_at) FROM quotes q WHERE q.quote_request_id = qr.id) AS premier_devis
            FROM quote_requests qr
            WHERE qr.created_at >= now() - interval '90 days'
              AND qr.from_home_size IS NOT NULL AND qr.from_home_size <> ''
              AND qr.from_home_type IS NOT NULL AND qr.from_home_type <> ''
              AND qr.to_home_size IS NOT NULL AND qr.to_home_size <> ''
              AND qr.to_home_type IS NOT NULL AND qr.to_home_type <> ''
              AND qr.volume_m3 IS NOT NULL AND qr.volume_m3 > 0
          )
          SELECT
            count(*) AS echantillon,
            round(avg(EXTRACT(EPOCH FROM (premier_devis - demande_creee)) / 3600)::numeric, 1) AS delai_moyen_heures,
            round(percentile_cont(0.5) WITHIN GROUP (ORDER BY EXTRACT(EPOCH FROM (premier_devis - demande_creee)) / 3600)::numeric, 1) AS delai_median_heures
          FROM first_quote
          WHERE premier_devis IS NOT NULL;

          \echo '=== 4) Nombre de demenageurs verifies actifs, pour contextualiser ==='
          SELECT count(*) AS demenageurs_verifies_actifs
          FROM movers
          WHERE verification_status = 'verified' AND is_active = true;

          \echo '=== 5) Total comptes clients (table clients) et total movers tout statut, avec dates ==='
          SELECT (SELECT count(*) FROM clients) AS total_clients,
                 (SELECT count(*) FROM movers) AS total_movers_tout_statut,
                 (SELECT min(created_at) FROM clients) AS premier_client,
                 (SELECT max(created_at) FROM clients) AS dernier_client;

          \echo '=== 6) quick_lead_verifications : combien de leads devis-rapide ont demarre, combien ont clique le lien (used_at) ==='
          SELECT count(*) AS total_quick_leads,
                 count(*) FILTER (WHERE used_at IS NOT NULL) AS ont_clique_le_lien
          FROM quick_lead_verifications;
          SQL
          )
          echo "$OUT"
          BODY=$(jq -n --arg t "Stats agrégées $(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg b "$OUT" '{title:$t, body:("```\n" + $b + "\n```")}')
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/issues" -d "$BODY"
