name: Stats (lecture seule, temporaire)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Requête stats agrégées (aucune PII)
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client jq
          set +e
          OUT=$(psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 -P pager=off <<'SQL' 2>&1

          \echo '=== AVANT : articles cibles par les criteres de corruption ==='
          SELECT slug, titre, statut, length(slug) AS len_slug
          FROM articles
          WHERE (titre IS NULL OR titre = '') OR length(slug) > 100 OR slug ILIKE '%html%'
          ORDER BY created_at;

          \echo '=== Depublication (statut -> brouillon) ==='
          UPDATE articles
          SET statut = 'brouillon'
          WHERE (titre IS NULL OR titre = '') OR length(slug) > 100 OR slug ILIKE '%html%';

          \echo '=== APRES : etat de la table articles ==='
          SELECT statut, count(*) FROM articles GROUP BY 1;
          SELECT slug, titre, statut FROM articles WHERE statut = 'publie' ORDER BY created_at DESC;
          SQL
          )
          echo "$OUT"
          BODY=$(jq -n --arg t "Stats agrégées $(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg b "$OUT" '{title:$t, body:("```\n" + $b + "\n```")}')
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/issues" -d "$BODY"
