name: Stats (lecture seule, temporaire)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Requête stats agrégées (aucune PII)
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client jq
          OUT=$(psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 <<'SQL' 2>&1
          -- Diagnostic contraintes UNIQUE sur quote_requests

          \echo '=== A) Toutes les contraintes de la table quote_requests ==='
          SELECT conname, contype, pg_get_constraintdef(oid) AS definition
          FROM pg_constraint
          WHERE conrelid = 'quote_requests'::regclass
          ORDER BY contype, conname;

          \echo '=== B) Tous les index UNIQUE sur quote_requests ==='
          SELECT indexname, indexdef
          FROM pg_indexes
          WHERE tablename = 'quote_requests' AND indexdef ILIKE '%UNIQUE%';

          \echo '=== C) Colonnes NOT NULL sans DEFAULT (pour construire un INSERT de repro valide) ==='
          SELECT column_name, data_type, is_nullable, column_default
          FROM information_schema.columns
          WHERE table_name = 'quote_requests' AND is_nullable = 'NO' AND column_default IS NULL
          ORDER BY ordinal_position;

          \echo '=== D) Tous les triggers BEFORE INSERT sur quote_requests (au cas ou plusieurs se marchent dessus) ==='
          SELECT tgname, pg_get_triggerdef(oid) AS definition
          FROM pg_trigger
          WHERE tgrelid = 'quote_requests'::regclass AND NOT tgisinternal;
          \echo '=== E) Reproduction : deux INSERT successifs, meme client_user_id, transaction annulee (aucun impact reel) ==='
          BEGIN;
          DO $$
          DECLARE
            test_user uuid := gen_random_uuid();
            ref1 text;
            ref2 text;
          BEGIN
            INSERT INTO quote_requests (
              client_user_id, client_name, client_email, client_phone,
              from_address, from_city, from_postal_code,
              to_address, to_city, to_postal_code,
              moving_date, status
            ) VALUES (
              test_user, 'Test Un', 'test1@example.com', '0600000000',
              '1 rue Test', 'Paris', '75001',
              '2 rue Test', 'Lyon', '69000',
              CURRENT_DATE + 30, 'new'
            ) RETURNING reference INTO ref1;
            RAISE NOTICE 'Premier INSERT OK, reference=%', ref1;

            INSERT INTO quote_requests (
              client_user_id, client_name, client_email, client_phone,
              from_address, from_city, from_postal_code,
              to_address, to_city, to_postal_code,
              moving_date, status
            ) VALUES (
              test_user, 'Test Un', 'test1@example.com', '0600000000',
              '1 rue Test', 'Paris', '75001',
              '2 rue Test', 'Lyon', '69000',
              CURRENT_DATE + 30, 'new'
            ) RETURNING reference INTO ref2;
            RAISE NOTICE 'Deuxieme INSERT (meme client_user_id) OK, reference=%', ref2;

            IF ref1 = ref2 THEN
              RAISE EXCEPTION 'COLLISION REPRODUITE: % = %', ref1, ref2;
            ELSE
              RAISE NOTICE 'PAS DE COLLISION: % != %', ref1, ref2;
            END IF;
          END $$;
          ROLLBACK;
          SQL
          )
          echo "$OUT"
          BODY=$(jq -n --arg t "Stats agrégées $(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg b "$OUT" '{title:$t, body:("```\n" + $b + "\n```")}')
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/issues" -d "$BODY"
