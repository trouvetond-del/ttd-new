name: Stats (lecture seule, temporaire)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verification contenu sitemap
        run: |
          curl -s "https://www.trouvetondemenageur.fr/sitemap.xml" -o /tmp/sitemap.xml
          echo "=== URLs demenagement dans le sitemap ==="
          grep -o '<loc>[^<]*demenagement[^<]*</loc>' /tmp/sitemap.xml
          echo "=== Nombre total d URLs ==="
          grep -c '<loc>' /tmp/sitemap.xml

      - name: Verification HTTP finale complete
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq
          set +e
          OUT=""
          for path in "demenagement/saint-etienne" "demenagement/lyon" "demenagement/lille" "demenagement/nantes" "demenagement/bordeaux" "demenagement/toulouse" "demenagement/ville-inexistante-xyz" "blog" "client/quote" "mover/signup" "sitemap.xml"; do
            URL="https://www.trouvetondemenageur.fr/$path"
            CODE=$(curl -s -L -o /tmp/page.html -w "%{http_code}" "$URL")
            TITLE=$(grep -o '<title>[^<]*</title>' /tmp/page.html | head -1)
            SIZE=$(wc -c < /tmp/page.html)
            OUT="$OUT\n=== /$path -> HTTP $CODE (taille: ${SIZE}o) ===\nTitle: $TITLE\n---\n"
          done
          echo -e "$OUT"
          BODY=$(echo -e "$OUT" | jq -Rs '{title: "Verification HTTP finale - toutes villes + routes critiques", body: ("```\n" + . + "\n```")}')
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/issues" -d "$BODY"

      - name: Requête stats agrégées (aucune PII)
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client jq
          set +e
          OUT=$(psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 -P pager=off <<'SQL' 2>&1

          \echo '=== Le compte existe-t-il toujours ? ==='
          SELECT id, email, email_confirmed_at IS NOT NULL AS email_confirme,
                 banned_until, deleted_at, aud, role, confirmed_at IS NOT NULL AS confirme,
                 encrypted_password IS NOT NULL AS a_un_mdp
          FROM auth.users WHERE email = 'qa-test-client@trouvetondemenageur.fr';

          \echo '=== Le mot de passe QaTestClient2026! correspond-il au hash stocke ? ==='
          SELECT email,
                 (encrypted_password = extensions.crypt('QaTestClient2026!', encrypted_password)) AS mdp_correspond
          FROM auth.users WHERE email = 'qa-test-client@trouvetondemenageur.fr';

          \echo '=== Ligne dans auth.identities existe-t-elle bien ? ==='
          SELECT provider, provider_id, user_id FROM auth.identities i
          JOIN auth.users u ON u.id = i.user_id
          WHERE u.email = 'qa-test-client@trouvetondemenageur.fr';

          \echo '=== Ligne clients associee ==='
          SELECT user_id, email, profile_completed FROM clients WHERE email = 'qa-test-client@trouvetondemenageur.fr';

          \echo '=== Comparaison : format dun compte admin connu fonctionnel (sans email/hash) ==='
          SELECT aud, role, banned_until, deleted_at, confirmed_at IS NOT NULL AS confirme,
                 email_confirmed_at IS NOT NULL AS email_confirme
          FROM auth.users WHERE id IN (SELECT user_id FROM admins LIMIT 1);
          SQL
          )
          echo "$OUT"
          BODY=$(jq -n --arg t "Stats agrégées $(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg b "$OUT" '{title:$t, body:("```\n" + $b + "\n```")}')
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/issues" -d "$BODY"
