name: Stats (lecture seule, temporaire)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verification HTTP des pages villes en production
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq
          set +e
          OUT=""
          for slug in paris saint-etienne marseille; do
            URL="https://www.trouvetondemenageur.fr/demenagement/$slug"
            CODE=$(curl -s -o /tmp/page_$slug.html -w "%{http_code}" "$URL")
            OUT="$OUT\n=== $URL -> HTTP $CODE ===\n"
            OUT="$OUT\nTitle: $(grep -o '<title>[^<]*</title>' /tmp/page_$slug.html)\n"
            OUT="$OUT\nCanonical: $(grep -o '<link rel=\"canonical\"[^>]*>' /tmp/page_$slug.html)\n"
            OUT="$OUT\nJSON-LD present: $(grep -q 'application/ld+json' /tmp/page_$slug.html && echo OUI || echo NON)\n"
            OUT="$OUT\nContenu #root non vide: $(grep -q '<div id=\"root\"><div' /tmp/page_$slug.html && echo OUI || echo NON)\n"
            OUT="$OUT\nExtrait #root (300 chars): $(grep -o '<div id=\"root\">.\{1,300\}' /tmp/page_$slug.html)\n"
            OUT="$OUT\n---\n"
          done
          echo -e "$OUT"
          BODY=$(echo -e "$OUT" | jq -Rs '{title: "Verification HTTP pages villes", body: ("```\n" + . + "\n```")}')
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/issues" -d "$BODY"

      - name: Requête stats agrégées (aucune PII)
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client jq
          set +e
          OUT=$(psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 -P pager=off <<'SQL' 2>&1
          BEGIN;
          \i supabase/migrations_manuelles/city-pages-table.sql
          \i supabase/migrations_manuelles/city-pages-seed.sql

          \echo '=== Resultat (transaction annulee) ==='
          SELECT slug, nom_ville, departement, statut FROM city_pages ORDER BY nom_ville;
          ROLLBACK;
          SQL
          )
          echo "$OUT"
          BODY=$(jq -n --arg t "Stats agrégées $(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg b "$OUT" '{title:$t, body:("```\n" + $b + "\n```")}')
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/issues" -d "$BODY"
