name: Stats (lecture seule, temporaire)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Requête stats agrégées (aucune PII)
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client jq
          set +e
          OUT=$(psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 -P pager=off <<'SQL' 2>&1

          \echo '=== Repartition par statut et type_article ==='
          SELECT statut, type_article, count(*) FROM articles GROUP BY 1, 2 ORDER BY 3 DESC;

          \echo '=== 10 derniers articles ==='
          SELECT slug, titre, ville, type_article, statut, created_at FROM articles ORDER BY created_at DESC LIMIT 10;

          \echo '=== Une eventuelle table villes/cities existe deja ? ==='
          SELECT table_name FROM information_schema.tables
          WHERE table_schema = 'public' AND (table_name ILIKE '%ville%' OR table_name ILIKE '%city%' OR table_name ILIKE '%cities%');
          SQL
          )
          echo "$OUT"
          BODY=$(jq -n --arg t "Stats agrégées $(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg b "$OUT" '{title:$t, body:("```\n" + $b + "\n```")}')
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/issues" -d "$BODY"
