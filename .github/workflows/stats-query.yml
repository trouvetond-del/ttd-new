name: Stats (lecture seule, temporaire)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Requête stats agrégées (aucune PII)
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client jq
          set +e
          OUT=$(psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 -P pager=off <<'SQL' 2>&1

          \echo '=== Colonnes ajoutees, presentes en prod ==='
          SELECT column_name, data_type, is_nullable, column_default
          FROM information_schema.columns
          WHERE table_name = 'quote_requests' AND column_name IN ('is_draft', 'submitted_at', 'resume_token', 'marketing_consent');

          \echo '=== Triggers actifs sur quote_requests apres deploiement ==='
          SELECT tgname FROM pg_trigger WHERE tgrelid = 'quote_requests'::regclass AND NOT tgisinternal ORDER BY tgname;

          \echo '=== Verification : toutes les demandes existantes sont bien is_draft=false (backfill) ==='
          SELECT count(*) AS total, count(*) FILTER (WHERE is_draft = false) AS non_brouillon, count(*) FILTER (WHERE is_draft = true) AS brouillon
          FROM quote_requests;
          SQL
          )
          echo "$OUT"
          BODY=$(jq -n --arg t "Stats agrégées $(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg b "$OUT" '{title:$t, body:("```\n" + $b + "\n```")}')
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/issues" -d "$BODY"
