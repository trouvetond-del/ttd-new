name: Stats (lecture seule, temporaire)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Requête stats agrégées (aucune PII)
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client jq
          set +e
          OUT=$(psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 -P pager=off <<'SQL' 2>&1
          BEGIN;

          \i supabase/migrations_manuelles/draft-quote-requests-system.sql

          \echo '=== TEST 1 : creation d un brouillon (is_draft=true par defaut) -> zero notification ==='
          DO $$
          DECLARE
            test_user uuid := gen_random_uuid();
            new_id uuid;
            notif_count integer;
          BEGIN
            INSERT INTO quote_requests (
              client_user_id, client_name, client_email, client_phone,
              from_address, from_city, from_postal_code,
              to_address, to_city, to_postal_code,
              from_home_size, from_home_type, to_home_size, to_home_type, volume_m3,
              moving_date, status
            ) VALUES (
              test_user, 'Test Draft', 'testdraft@example.com', '0600000000',
              '1 rue Test', 'Paris', '75001',
              '2 rue Test', 'Lyon', '69000',
              'T2', 'Appartement', 'T2', 'Appartement', 20,
              CURRENT_DATE + 30, 'new'
            ) RETURNING id INTO new_id;

            SELECT count(*) INTO notif_count FROM notifications WHERE related_id = new_id;
            RAISE NOTICE 'Brouillon cree, id=%, notifications generees=%', new_id, notif_count;
            IF notif_count > 0 THEN
              RAISE EXCEPTION 'ECHEC: un brouillon a genere % notification(s), il ne devrait en generer AUCUNE', notif_count;
            ELSE
              RAISE NOTICE 'OK: brouillon = zero notification, comme attendu';
            END IF;

            -- ETAPE 2 : bascule vers soumis
            UPDATE quote_requests SET is_draft = false, submitted_at = now() WHERE id = new_id;

            SELECT count(*) INTO notif_count FROM notifications WHERE related_id = new_id;
            RAISE NOTICE 'Apres passage is_draft=false, notifications generees=%', notif_count;
            IF notif_count = 0 THEN
              RAISE EXCEPTION 'ECHEC: la soumission finale n a genere AUCUNE notification, le matching est casse';
            ELSE
              RAISE NOTICE 'OK: soumission = % notification(s) generee(s), matching fonctionnel', notif_count;
            END IF;
          END $$;

          \echo '=== TEST 2 : ancien parcours (INSERT direct avec is_draft=false explicite) reste fonctionnel (retro-compat) ==='
          DO $$
          DECLARE
            test_user uuid := gen_random_uuid();
            new_id uuid;
            notif_count integer;
          BEGIN
            INSERT INTO quote_requests (
              client_user_id, client_name, client_email, client_phone,
              from_address, from_city, from_postal_code,
              to_address, to_city, to_postal_code,
              from_home_size, from_home_type, to_home_size, to_home_type, volume_m3,
              moving_date, status, is_draft
            ) VALUES (
              test_user, 'Test Direct', 'testdirect@example.com', '0600000001',
              '1 rue Test', 'Paris', '75001',
              '2 rue Test', 'Lyon', '69000',
              'T2', 'Appartement', 'T2', 'Appartement', 20,
              CURRENT_DATE + 30, 'new', false
            ) RETURNING id INTO new_id;

            SELECT count(*) INTO notif_count FROM notifications WHERE related_id = new_id;
            RAISE NOTICE 'INSERT direct is_draft=false, notifications generees=%', notif_count;
            IF notif_count = 0 THEN
              RAISE EXCEPTION 'ECHEC: le parcours de soumission actuel (INSERT direct) est casse';
            ELSE
              RAISE NOTICE 'OK: parcours actuel toujours fonctionnel';
            END IF;
          END $$;

          ROLLBACK;
          SQL
          )
          echo "$OUT"
          BODY=$(jq -n --arg t "Stats agrégées $(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg b "$OUT" '{title:$t, body:("```\n" + $b + "\n```")}')
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/issues" -d "$BODY"
