name: Déployer alerte rappel devis rapide
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'supabase/functions/agent-callback-alert/**'
      - 'supabase/migrations_manuelles/callback-alert.sql'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SQL
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client
          psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 -f supabase/migrations_manuelles/callback-alert.sql
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy agent-callback-alert --project-ref bvvbkaluajgdurxnnqqu --no-verify-jwt
