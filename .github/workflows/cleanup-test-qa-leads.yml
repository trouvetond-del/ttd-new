name: Cleanup temporaire - retire les leads de test QA

on:
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Supprimer les leads de test crees pendant le diagnostic
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client
          psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 -c "DELETE FROM quote_requests WHERE client_email LIKE 'test-qa-%@example.com';"
          psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 -c "DELETE FROM mover_lead_verifications WHERE email LIKE 'test-mover-qa-%@example.com';"
          psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 -c "DELETE FROM movers WHERE email LIKE 'test-mover-qa-%@example.com';"
