name: Déployer liste des déménagements ouverts
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'supabase/sql/list_open_moves.sql'
      - '.github/workflows/deploy-open-moves.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          q() { python3 -c 'import json,sys;print(json.dumps({"query":sys.stdin.read()}))' | curl -sS -f -X POST "https://api.supabase.com/v1/projects/bvvbkaluajgdurxnnqqu/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @-; echo; }
          q < supabase/sql/list_open_moves.sql
          echo "select count(*) as ouverts from public.list_open_moves();" | q
          echo "select status, count(*) from quote_requests where moving_date >= current_date group by status;" | q
          echo "select reference,is_draft,created_at,updated_at,from_address is not null and from_address<>'' fa,to_address is not null and to_address<>'' ta,floor_from,floor_to,volume_m3,from_home_size from quote_requests where reference='TTD-496167';" | q
