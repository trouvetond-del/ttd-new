name: Inspect duplicate account safeguards
on:
  workflow_dispatch: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY' > /tmp/query.json
          import json
          q="""select json_build_object('customer', (select json_build_object('requests',count(*),'distinct_accounts',count(distinct client_user_id),'references',json_agg(json_build_object('id',id,'reference',reference,'created_at',created_at,'draft',is_draft,'deleted',deleted_at is not null,'status',status))) from public.quote_requests where regexp_replace(client_phone,'[^0-9]','','g') in ('0745528486','33745528486')), 'columns', (select json_agg(c) from (select table_name,column_name,data_type from information_schema.columns where table_schema='public' and table_name in ('clients','movers','quote_requests')) c), 'guards',(select json_agg(t) from (select tgrelid::regclass::text as table_name,tgname,pg_get_functiondef(tgfoid) as body from pg_trigger where tgrelid in ('public.clients'::regclass,'public.movers'::regclass,'auth.users'::regclass,'public.quote_requests'::regclass) and not tgisinternal) t));"""
          print(json.dumps({'query':q}))
          PY
          curl -fsS -X POST https://api.supabase.com/v1/projects/bvvbkaluajgdurxnnqqu/database/query -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @/tmp/query.json
