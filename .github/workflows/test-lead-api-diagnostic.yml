name: Test manuel API quick-lead v2

on:
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Tester l'API quick-lead reelle (bons noms de champs) et publier le resultat
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq
          TS=$(date +%s)
          echo "--- Test client (api/quick-lead) ---"
          R1=$(curl -s -X POST https://www.trouvetondemenageur.fr/api/quick-lead -H "Content-Type: application/json" -d "{\"first_name\":\"TestQA\",\"last_name\":\"Audit$TS\",\"from_address\":\"1 rue de Rivoli\",\"from_city\":\"Paris\",\"from_postal_code\":\"75001\",\"to_address\":\"1 place Bellecour\",\"to_city\":\"Lyon\",\"to_postal_code\":\"69001\",\"phone\":\"0612345678\",\"email\":\"test-qa-$TS@example.com\"}")
          echo "--- Test mover (api/mover-quick-lead) - SIRET valide Luhn ---"
          R2=$(curl -s -X POST https://www.trouvetondemenageur.fr/api/mover-quick-lead -H "Content-Type: application/json" -d "{\"manager_firstname\":\"TestQA\",\"manager_lastname\":\"Audit$TS\",\"company_name\":\"Test SARL QA $TS\",\"siret\":\"73282932000074\",\"phone\":\"0612345678\",\"email\":\"test-mover-qa-$TS@example.com\"}")
          BODY=$(jq -n --arg a "$R1" --arg b "$R2" '{title: "Diagnostic v2 - tunnels de capture", body: ("api/quick-lead:\n```\n" + $a + "\n```\n\napi/mover-quick-lead:\n```\n" + $b + "\n```")}')
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/issues" -d "$BODY"
