name: Test manuel API quick-lead

on:
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Tester l'API quick-lead reelle et publier le resultat
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq
          echo "--- Test 1: page devis-rapide (HTML) ---"
          R1=$(curl -s -o /dev/null -w "%{http_code}" -L https://www.trouvetondemenageur.fr/devis-rapide)
          echo "--- Test 2: page inscription-demenageur (HTML) ---"
          R2=$(curl -s -o /dev/null -w "%{http_code}" -L https://www.trouvetondemenageur.fr/inscription-demenageur)
          echo "--- Test 3: appel reel a api/quick-lead avec des fausses donnees ---"
          R3=$(curl -s -X POST https://www.trouvetondemenageur.fr/api/quick-lead -H "Content-Type: application/json" -d '{"firstName":"TestQA","lastName":"Audit","fromAddress":"1 rue de Test, 75001 Paris","fromCity":"Paris","fromPostalCode":"75001","toAddress":"1 rue de Test, 69001 Lyon","toCity":"Lyon","toPostalCode":"69001","phone":"0612345678","email":"test-qa-audit-2026@example.com"}')
          echo "--- Test 4: appel reel a api/mover-quick-lead avec des fausses donnees ---"
          R4=$(curl -s -X POST https://www.trouvetondemenageur.fr/api/mover-quick-lead -H "Content-Type: application/json" -d '{"managerFirstname":"TestQA","managerLastname":"Audit","companyName":"Test SARL QA","siret":"00000000000000","phone":"0612345678","email":"test-mover-qa-audit-2026@example.com"}')
          BODY=$(jq -n --arg a "$R1" --arg b "$R2" --arg c "$R3" --arg d "$R4" '{title: "Diagnostic tunnels de capture (pourquoi 0 lead)", body: ("Page /devis-rapide HTTP: " + $a + "\n\nPage /inscription-demenageur HTTP: " + $b + "\n\napi/quick-lead reponse:\n```\n" + $c + "\n```\n\napi/mover-quick-lead reponse:\n```\n" + $d + "\n```")}')
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/issues" -d "$BODY"
