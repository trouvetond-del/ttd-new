name: Déployer relances admin + agent fraude
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'supabase/functions/admin-followup/**'
      - 'supabase/functions/send-admin-followups/**'
      - 'supabase/functions/agent-fraud-guard/**'
      - 'supabase/functions/_shared/followup-email.ts'
      - 'supabase/migrations_manuelles/admin-followups.sql'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SQL
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client
          psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 -f supabase/migrations_manuelles/admin-followups.sql
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy admin-followup --project-ref bvvbkaluajgdurxnnqqu --no-verify-jwt
          supabase functions deploy send-admin-followups --project-ref bvvbkaluajgdurxnnqqu --no-verify-jwt
          supabase functions deploy agent-fraud-guard --project-ref bvvbkaluajgdurxnnqqu --no-verify-jwt
