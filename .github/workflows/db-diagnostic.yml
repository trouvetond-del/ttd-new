name: DB Diagnostic

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verification URL Supabase reellement utilisee en production
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client jq
          set +e

          MAIN_JS=$(curl -s https://www.trouvetondemenageur.fr/ | grep -oP '/assets/index-[a-zA-Z0-9_-]+\.js' | head -1)
          curl -s "https://www.trouvetondemenageur.fr${MAIN_JS}" -o /tmp/main.js
          PROD_SUPABASE=$(grep -oP '[a-zA-Z0-9-]+\.supabase\.co' /tmp/main.js | sort -u)
          EXPECTED_SUPABASE=$(echo "${{ secrets.SUPABASE_DB_URL }}" | grep -oP '(?<=@db\.)[a-zA-Z0-9-]+(?=\.supabase\.co)')

          OUT="Fichier JS principal: ${MAIN_JS}
Domaines supabase.co trouves dans le bundle de production:
${PROD_SUPABASE}

Projet attendu (extrait de SUPABASE_DB_URL, celui interroge par psql toute la session): ${EXPECTED_SUPABASE}.supabase.co

CONCORDANCE: $(echo "$PROD_SUPABASE" | grep -q "$EXPECTED_SUPABASE" && echo "OUI, meme projet" || echo "NON -- PROJETS DIFFERENTS, C'EST LA CAUSE")"

          echo "$OUT"
          BODY=$(jq -n --arg t "Verification projet Supabase production vs DB interrogee" --arg b "$OUT" '{title:$t, body:("```\n" + $b + "\n```")}')
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/issues" -d "$BODY"
