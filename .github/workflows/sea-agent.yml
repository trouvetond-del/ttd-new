name: Agent SEA — pilote automatique quotidien
on:
  schedule:
    - cron: '30 7 * * *'  # 8 h 30 Paris : chiffres de la veille complets
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sea-agent
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tester les règles SEA
        run: node --test scripts/sea-agent/rules.test.mjs scripts/sea-agent/autopilot.test.mjs
      - name: Préparer les rapports et validations admin
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations_manuelles/sea-reports.sql -f supabase/migrations_manuelles/sea-actions.sql
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Déployer l'email quotidien SEA
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash scripts/sea-agent/edge/install.sh
      - name: Installer le client des rapports
        working-directory: scripts/sea-agent
        run: npm install --no-audit --no-fund --no-save @supabase/supabase-js@2
      - name: Piloter les campagnes seul (plafond 300 €/mois) et envoyer l'email
        working-directory: scripts/sea-agent
        env:
          SUPABASE_URL: https://bvvbkaluajgdurxnnqqu.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
          META_ADS_ACCOUNT_ID: '4033030426839553'
          GOOGLE_ADS_CUSTOMER_ID: '1037374421'
          GOOGLE_ADS_API_KEY: ${{ secrets.GOOGLE_ADS_API_KEY }}
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node run.mjs
