name: Déployer actions admin client (activer / relancer)
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'supabase/functions/admin-client-actions/**'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy admin-client-actions --project-ref bvvbkaluajgdurxnnqqu --no-verify-jwt
