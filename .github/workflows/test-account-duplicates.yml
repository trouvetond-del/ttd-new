name: Verify duplicate prevention without persisted test data
on:
  workflow_dispatch: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 -c 'import json;print(json.dumps({"query":open("scripts/account-duplicates.test.sql").read()}))' > /tmp/query.json
          curl -fsS -X POST https://api.supabase.com/v1/projects/bvvbkaluajgdurxnnqqu/database/query -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @/tmp/query.json
