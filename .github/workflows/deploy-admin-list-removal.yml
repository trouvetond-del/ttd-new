name: Deploy reversible admin list removal
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['supabase/sql/admin-list-removal.sql', '.github/workflows/deploy-admin-list-removal.yml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          q() { python3 -c 'import json,sys;print(json.dumps({"query":sys.stdin.read()}))' | curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/bvvbkaluajgdurxnnqqu/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @-; echo; }
          q < supabase/sql/admin-list-removal.sql
          q < scripts/admin-list-removal.test.sql
