name: Déployer suivi calculateur
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'supabase/migrations_manuelles/quote-acquisition-source.sql'
      - '.github/workflows/deploy-quote-acquisition-source.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client
          psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 -f supabase/migrations_manuelles/quote-acquisition-source.sql
