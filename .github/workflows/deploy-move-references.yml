name: Références déménagement numériques
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'supabase/migrations_manuelles/quote-random-reference.sql'
      - '.github/workflows/deploy-move-references.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrer et vérifier les références
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations_manuelles/quote-random-reference.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF EXISTS (SELECT 1 FROM public.quote_requests WHERE reference IS NULL OR reference !~ '^TTD-[0-9]{6}$') OR EXISTS (SELECT reference FROM public.quote_requests GROUP BY reference HAVING count(*) > 1) THEN RAISE EXCEPTION 'Invalid move references'; END IF; END \$\$;"