name: Déployer groupage + devis admin
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'supabase/migrations_manuelles/groupage-and-admin-quote.sql'
      - '.github/workflows/deploy-groupage.yml'
      - 'supabase/functions/send-groupage-emails/**'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client
          psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 -f supabase/migrations_manuelles/groupage-and-admin-quote.sql
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy send-groupage-emails --project-ref bvvbkaluajgdurxnnqqu --no-verify-jwt
