name: Deploy and verify quote request trash
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['supabase/sql/quote-request-trash.sql', '.github/workflows/deploy-quote-trash.yml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          q() { python3 -c 'import json,sys;print(json.dumps({"query":sys.stdin.read()}))' | curl -sS -f -X POST "https://api.supabase.com/v1/projects/bvvbkaluajgdurxnnqqu/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @-; echo; }
          q < supabase/sql/quote-request-trash.sql
          q < scripts/quote-request-trash.test.sql
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          supabase functions deploy admin-invite-mover-quote --project-ref bvvbkaluajgdurxnnqqu --yes
          supabase functions deploy admin-invite-quote-lead --project-ref bvvbkaluajgdurxnnqqu --yes
          supabase functions deploy admin-send-client-quote-reminder --project-ref bvvbkaluajgdurxnnqqu --yes
          supabase functions deploy admin-send-draft-reminder --project-ref bvvbkaluajgdurxnnqqu --yes
          supabase functions deploy agent-monitor-errors --project-ref bvvbkaluajgdurxnnqqu --yes
          supabase functions deploy announce-find-moves --project-ref bvvbkaluajgdurxnnqqu --yes
          supabase functions deploy send-client-quote-reminder --project-ref bvvbkaluajgdurxnnqqu --yes
          supabase functions deploy send-draft-reminder --project-ref bvvbkaluajgdurxnnqqu --yes
          supabase functions deploy send-groupage-emails --project-ref bvvbkaluajgdurxnnqqu --yes
          supabase functions deploy send-mover-quote-reminders --project-ref bvvbkaluajgdurxnnqqu --yes
          supabase functions deploy send-no-account-reminder --project-ref bvvbkaluajgdurxnnqqu --yes
          supabase functions deploy send-photo-protection-reminder --project-ref bvvbkaluajgdurxnnqqu --yes
          supabase functions deploy send-quick-lead-verification-reminder --project-ref bvvbkaluajgdurxnnqqu --yes
