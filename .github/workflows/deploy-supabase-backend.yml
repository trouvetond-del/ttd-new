name: Déploiement backend Supabase (SQL + Edge Functions)

on:
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exécuter le SQL (colonnes profile_completed / reminder_sent_at)
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client jq
          set +e
          FILES="supabase/migrations_manuelles/critical-payment-security-fix.sql supabase/migrations_manuelles/fix-quote-requests-direct-acceptance.sql supabase/migrations_manuelles/fix-messaging-payment-gate.sql supabase/migrations_manuelles/precaution-drop-old-reviews-policy.sql supabase/migrations_manuelles/mover-reminder-sent-at.sql supabase/migrations_manuelles/quick-lead-profile-completed.sql supabase/migrations_manuelles/quick-lead-verifications.sql supabase/migrations_manuelles/mover-lead-verifications.sql supabase/migrations_manuelles/quote-reference-and-reminders.sql supabase/migrations_manuelles/quote-requests-view-add-reference-v2.sql supabase/migrations_manuelles/quote-reminder-log-and-notif-type.sql supabase/migrations_manuelles/nearby-mission-notif-require-complete.sql supabase/migrations_manuelles/client-quote-reminder-log.sql supabase/migrations_manuelles/client-quote-reminder-log-triggered-by.sql supabase/migrations_manuelles/urgent-quote-requests-require-complete.sql supabase/migrations_manuelles/normalize-mover-city.sql supabase/migrations_manuelles/quick-lead-verification-reminder.sql supabase/migrations_manuelles/draft-quote-requests-system.sql supabase/migrations_manuelles/reengagement-and-photo-reminder-setup.sql supabase/migrations_manuelles/setup-cron-jobs.sql"
          for f in $FILES; do
            echo "=== Running $f ==="
            OUT=$(psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 -f "$f" 2>&1)
            CODE=$?
            echo "$OUT"
            if [ $CODE -ne 0 ]; then
              BODY=$(jq -n --arg t "SQL migration failed: $f" --arg b "$OUT" '{title:$t, body:$b}')
              curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/issues" -d "$BODY"
              exit 1
            fi
          done

      - name: Installer la CLI Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Déployer link-quick-lead-account
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy link-quick-lead-account --project-ref bvvbkaluajgdurxnnqqu

      - name: Déployer send-signup-otp
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy send-signup-otp --project-ref bvvbkaluajgdurxnnqqu

      - name: Déployer verify-signup-otp
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy verify-signup-otp --project-ref bvvbkaluajgdurxnnqqu

      - name: Déployer create-invited-mover
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy create-invited-mover --project-ref bvvbkaluajgdurxnnqqu

      - name: Déployer send-profile-reminder
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy send-profile-reminder --project-ref bvvbkaluajgdurxnnqqu --no-verify-jwt

      - name: Déployer get-quick-lead-verification
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy get-quick-lead-verification --project-ref bvvbkaluajgdurxnnqqu

      - name: Déployer create-quick-lead-account
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy create-quick-lead-account --project-ref bvvbkaluajgdurxnnqqu

      - name: Déployer send-notification
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy send-notification --project-ref bvvbkaluajgdurxnnqqu

      - name: Déployer get-mover-lead-verification
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy get-mover-lead-verification --project-ref bvvbkaluajgdurxnnqqu

      - name: Déployer create-mover-lead-account
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy create-mover-lead-account --project-ref bvvbkaluajgdurxnnqqu

      - name: Déployer admin-invite-quote-lead
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy admin-invite-quote-lead --project-ref bvvbkaluajgdurxnnqqu

      - name: Déployer create-payment-intent
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy create-payment-intent --project-ref bvvbkaluajgdurxnnqqu

      - name: Déployer send-mover-quote-reminders
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy send-mover-quote-reminders --project-ref bvvbkaluajgdurxnnqqu --no-verify-jwt

      - name: Déployer send-client-quote-reminder
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy send-client-quote-reminder --project-ref bvvbkaluajgdurxnnqqu --no-verify-jwt

      - name: Déployer admin-send-client-quote-reminder
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy admin-send-client-quote-reminder --project-ref bvvbkaluajgdurxnnqqu

      - name: Déployer send-welcome-email
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy send-welcome-email --project-ref bvvbkaluajgdurxnnqqu --no-verify-jwt

      - name: Déployer process-welcome-emails
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy process-welcome-emails --project-ref bvvbkaluajgdurxnnqqu --no-verify-jwt

      - name: Déployer send-photo-protection-reminder
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy send-photo-protection-reminder --project-ref bvvbkaluajgdurxnnqqu --no-verify-jwt

      - name: Déployer send-mover-profile-reminder
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy send-mover-profile-reminder --project-ref bvvbkaluajgdurxnnqqu --no-verify-jwt

      - name: Déployer send-quick-lead-verification-reminder
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy send-quick-lead-verification-reminder --project-ref bvvbkaluajgdurxnnqqu --no-verify-jwt

      - name: Déployer send-client-reengagement
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy send-client-reengagement --project-ref bvvbkaluajgdurxnnqqu --no-verify-jwt

      - name: Mettre à jour le template email "Magic Link"
        run: |
          python3 supabase/email-templates/build_patch_body.py
          curl -sf -X PATCH "https://api.supabase.com/v1/projects/bvvbkaluajgdurxnnqqu/config/auth" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @/tmp/auth_config_patch.json -o /dev/null -w "HTTP %{http_code}\n"

      - name: Résumé
        run: echo "✅ SQL exécuté + 2 edge functions déployées + template email mis à jour."
