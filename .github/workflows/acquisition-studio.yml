name: Studio — Reels de la Machine d'acquisition
on:
  schedule:
    - cron: "0 10 * * 2,5"  # mardi (client) et vendredi (déménageur), 11 h Paris
  workflow_dispatch:
    inputs:
      force_audience:
        description: "client ou mover — vide = planning normal"
        required: false
        default: ""
concurrency:
  group: marketing-agent
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Préparer la base (idempotent)
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client ffmpeg
          psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 -f supabase/migrations_manuelles/acquisition-studio.sql
      - name: Créer et publier le Reel
        working-directory: scripts/marketing-agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: https://bvvbkaluajgdurxnnqqu.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          LINKEDIN_API_KEY: ${{ secrets.LINKEDIN_API_KEY }}
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FORCE_AUDIENCE: ${{ github.event.inputs.force_audience }}
        run: |
          npm install --no-audit --no-fund @supabase/supabase-js@2
          node from-acquisition.mjs
