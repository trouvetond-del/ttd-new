name: Relance démontage — cliente Lézat (Toulouse → Brest)
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/disassembly-reminder-lezat.yml'
      - 'src/lib/disassemblyDetails.ts'
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Déployer la fonction
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy admin-client-actions --project-ref bvvbkaluajgdurxnnqqu --no-verify-jwt --yes
      - name: Envoyer l'email une seule fois
        env:
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          U="https://bvvbkaluajgdurxnnqqu.supabase.co"; K=os.environ["KEY"]
          H={"Authorization":"Bearer "+K,"apikey":K,"Content-Type":"application/json"}
          q=json.load(urllib.request.urlopen(urllib.request.Request(U+"/rest/v1/quote_requests?select=id,reference,services_needed,additional_info,furniture_photos,elevator_capacity_from&client_email=eq.lezatbeatrice@orange.fr&deleted_at=is.null&order=created_at.desc&limit=1",headers=H)))
          assert q, "Demande introuvable"
          q=q[0]; print("Demande", q["reference"], q["services_needed"], "| photos:", len(q.get("furniture_photos") or []), "| taille ascenseur:", q.get("elevator_capacity_from"))
          r=urllib.request.urlopen(urllib.request.Request(U+"/functions/v1/admin-client-actions",data=json.dumps({"action":"disassembly_details","quoteRequestId":q["id"]}).encode(),headers=H,method="POST"))
          print("Réponse", r.status, r.read().decode())
          PY
