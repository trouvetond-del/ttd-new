name: Annonce « Trouver des déménagements »
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/announce-find-moves/**'
  schedule:
    - cron: '0 8 4 12 *'   # 4 décembre, 9 h Paris
  workflow_dispatch:
    inputs:
      mode:
        description: 'test ou all'
        default: 'test'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Déployer
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy announce-find-moves --project-ref bvvbkaluajgdurxnnqqu --no-verify-jwt --yes
      - name: Envoyer
        env:
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            [ "$(date -u +%Y)" = "2026" ] || { echo "Annonce déjà faite"; exit 0; }
            MODE=all
          fi
          [ -z "$MODE" ] && MODE=test
          curl -sS --fail-with-body -X POST https://bvvbkaluajgdurxnnqqu.supabase.co/functions/v1/announce-find-moves \
            -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d "{\"mode\":\"$MODE\",\"company\":\"DROP IT\"}"
