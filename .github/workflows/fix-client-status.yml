name: fix-client-status
on:
  push:
    paths: ['.github/workflows/fix-client-status.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          cat > /tmp/p.py <<'PY'
          p='src/components/admin/AdminUserManagement.tsx';s=open(p).read()
          old="supabase.from('quote_requests').select('client_user_id'),"
          assert s.count(old)==2
          s=s.replace(old,"supabase.from('quote_requests').select('client_user_id, is_draft, deleted_at'),")
          old2="const qrUserIds = new Set(((qrResult as any)?.data || []).map((q: any) => q.client_user_id).filter(Boolean));"
          assert s.count(old2)==2
          s=s.replace(old2,"// Actif = au moins une demande de devis réellement envoyée (ni brouillon, ni supprimée).\n        const qrUserIds = new Set(((qrResult as any)?.data || []).filter((q: any) => q.is_draft !== true && !q.deleted_at).map((q: any) => q.client_user_id).filter(Boolean));")
          old3="profileCompleted: client.profile_completed === true || (qrUserIds.has(client.user_id) && !!client.phone && !!client.first_name),"
          assert s.count(old3)==2
          s=s.replace(old3,"profileCompleted: qrUserIds.has(client.user_id) && !!client.phone && !!client.first_name,")
          a=s.index("{user.role === 'client' && user.is_active === false && (")
          b=s.index("</button>\n                        )}",a)+len("</button>\n                        )}")
          s=s[:a]+s[b:]
          open(p,'w').write(s)
          PY
          python3 /tmp/p.py
          git config user.name "ttd-bot"; git config user.email "bot@trouvetondemenageur.fr"
          git add -A && git commit -m "Admin: client Actif seulement après une demande de devis envoyée" && git push
